spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/Negocio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Se cambia de 'create' a 'update' para que persistan tus datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

negocio.admin.username=${NEGOCIO_ADMIN_USERNAME:admin}
negocio.admin.password=${NEGOCIO_ADMIN_PASSWORD:cambiar123}
negocio.vendedor.username=${NEGOCIO_VENDOR_USERNAME:vendedor}
negocio.vendedor.password=${NEGOCIO_VENDOR_PASSWORD:venta123}

